<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f8f9fb" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Data Agent Lab" />
<title>Data Agent Lab · Home V1</title>
<style>
:root{--ink:#151519;--muted:#7d808e;--blue:#94b5ff;--purple:#db86f1;--orange:#ff9a38;--yellow:#ffd86d;--mint:#c8efd5;--paper:#f8f9fb}
*{box-sizing:border-box}html,body{margin:0;background:#e9edf2;color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","PingFang SC",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:inherit;border:0}.app{width:min(100%,430px);margin:auto;min-height:100dvh;background:var(--paper);padding:calc(18px + env(safe-area-inset-top)) 18px calc(104px + env(safe-area-inset-bottom));overflow:hidden;box-shadow:0 0 70px rgba(15,20,35,.14)}
.topbar{display:flex;align-items:center;justify-content:space-between;animation:up .45s both}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px}.brand strong{display:block;font-size:16px;line-height:1.05}.brand small{display:block;color:#868998;font-size:10px;margin-top:4px;letter-spacing:.03em}.search{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(20,20,24,.08)}
.hello{display:flex;align-items:flex-end;justify-content:space-between;margin:26px 2px 14px;animation:up .48s .05s both}.hello .eyebrow{font-size:10px;font-weight:900;letter-spacing:.16em;color:#ff8e2d;margin:0 0 6px}.hello h1{font-size:31px;line-height:1.08;margin:0;font-weight:950;letter-spacing:-.045em}.hello .sub{font-size:13px;color:var(--muted);margin:7px 0 0}.smiley{font-family:"Marker Felt","Comic Sans MS",cursive;font-size:29px;transform:rotate(8deg);margin:0 8px 5px}
.hero{position:relative;height:282px;background:var(--blue);border-radius:30px;padding:23px;overflow:hidden;box-shadow:0 18px 38px rgba(76,105,170,.18);animation:pop .55s .1s both}.hero-copy{position:relative;z-index:4;width:56%}.kicker{font-size:10px;font-weight:900;letter-spacing:.14em}.hero h2{font-size:35px;line-height:.93;margin:12px 0 11px;letter-spacing:-.04em}.hero p{font-size:13px;line-height:1.45;margin:0 0 18px}.cta{background:var(--ink);color:#fff;border-radius:999px;padding:13px 18px;font-weight:850;display:inline-flex;align-items:center;gap:14px;box-shadow:0 8px 15px rgba(20,20,24,.18);transition:.16s transform}.cta:active{transform:scale(.96)}.hero-art{position:absolute;right:-2px;bottom:-7px;width:65%;z-index:2;animation:float 4.8s ease-in-out infinite}.scribble{position:absolute;right:18px;top:19px;z-index:4;font-family:"Marker Felt","Comic Sans MS",cursive;font-size:12px;line-height:1.05;transform:rotate(7deg)}.spark{position:absolute;z-index:5;font-size:21px}.sa{right:27px;top:91px}.sb{left:53%;bottom:27px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.card{min-height:157px;border-radius:26px;padding:17px;text-align:left;position:relative;overflow:hidden;animation:up .45s both;transition:.17s transform}.card:active,.strip:active,.pick:active{transform:scale(.975)}.tech{background:linear-gradient(145deg,#e6a3f5,#d47bea);animation-delay:.18s}.project{background:linear-gradient(145deg,#ffc075,#ff9530);animation-delay:.22s}.card:after{content:"";position:absolute;width:95px;height:95px;border:2px solid rgba(20,20,24,.08);right:-43px;bottom:-48px;border-radius:50%}.topline{display:flex;justify-content:space-between;font-size:11px;font-weight:900}.pill{background:rgba(255,255,255,.72);padding:5px 8px;border-radius:999px}.card h3{font-size:22px;margin:20px 0 5px}.card p{font-size:12px;line-height:1.45;margin:0;max-width:82%}.go{position:absolute;right:14px;bottom:14px;width:36px;height:36px;background:var(--ink);color:#fff;border-radius:50%;display:grid;place-items:center;font-size:20px}
.strip{width:100%;margin-top:12px;min-height:119px;border-radius:26px;background:#fff;border:1.5px solid var(--ink);padding:18px;text-align:left;position:relative;overflow:hidden;animation:up .45s .27s both;transition:.17s transform}.strip .meta{font-size:10px;letter-spacing:.11em;font-weight:900;color:#6f7280}.strip h3{font-size:20px;margin:7px 0 4px;max-width:72%}.strip p{font-size:11px;color:#7c7f8d;margin:0}.strip-art{position:absolute;right:26px;top:7px;width:96px}.strip .go{background:var(--blue);color:var(--ink)}
.today{margin-top:24px;animation:up .45s .32s both}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:0 2px 10px}.head span{font-size:11px;color:#8a8d99}.head h3{font-size:20px;margin:2px 0 0}.head button{background:transparent;color:#676bd6;font-size:12px}.pick{width:100%;border-radius:24px;background:var(--ink);color:#fff;padding:17px;text-align:left;box-shadow:0 15px 32px rgba(20,20,24,.18);transition:.17s transform}.pick-meta{display:flex;justify-content:space-between;font-size:10px;font-weight:900;letter-spacing:.12em;color:#ffb066}.pick-main{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:9px}.pick h3{font-size:22px;margin:0 0 4px}.pick p{font-size:12px;line-height:1.4;color:#c9cbd3;margin:0}.pick .go{position:static;flex:0 0 auto;background:#fff;color:var(--ink);font-size:22px}.progress{height:6px;background:rgba(255,255,255,.14);border-radius:999px;margin-top:13px;overflow:hidden}.progress i{display:block;height:100%;width:64%;border-radius:inherit;background:linear-gradient(90deg,#91b5ff,#d879ef)}
.growth{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:13px;animation:up .45s .36s both}.stat{border-radius:24px;padding:16px;min-height:140px}.streak{background:#ffd6bf}.weekly{background:#c9efd4}.stat label{display:block;font-size:11px;font-weight:850;color:#5f636e}.stat strong{display:block;font-size:42px;margin:12px 0 3px;letter-spacing:-.04em}.stat strong small{font-size:18px}.stat p{font-size:11px;margin:0;color:#6f7079}.green{background:rgba(20,20,24,.1)}.green i{width:68%;background:#2cb86c}.quote{margin:20px 4px 7px;font-family:"Marker Felt","Comic Sans MS",cursive;font-size:14px;line-height:1.5;transform:rotate(-2deg)}
.nav{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 28px),402px);height:70px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(20,20,24,.08);border-radius:28px;box-shadow:0 14px 30px rgba(20,20,24,.13);display:grid;grid-template-columns:repeat(5,1fr);z-index:30;padding:6px 5px}.nav button{background:transparent;border-radius:21px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#8b8e9b;font-size:9px}.nav button.active{background:var(--ink);color:#fff}.nav svg{width:22px;height:22px}
.toast{position:fixed;z-index:50;left:50%;bottom:94px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#151519;color:white;border-radius:999px;padding:10px 15px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.22);transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(.8deg)}}
@media(max-width:360px){.app{padding-left:14px;padding-right:14px}.hello h1{font-size:28px}.hero{height:265px;padding:20px}.hero h2{font-size:31px}.brand small{display:none}.card{padding:15px;min-height:148px}.card h3{font-size:20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><svg class="logo" viewBox="0 0 48 48"><path d="M6 38 19 10l8 15 5-9 10 22H6Z" fill="#8fb2ff" stroke="#141418" stroke-width="3.2" stroke-linejoin="round"/><path d="m14 28 5-9 5 9 3-4" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg><div><strong>Data Agent Lab</strong><small>Learn · Build · Interview · Grow</small></div></div>
    <button class="search tap" data-label="搜索很快会接上"><svg width="20" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15 15 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </header>

  <section class="hello"><div><p class="eyebrow">SAME LEARNER · NEW ME</p><h1>Hey，<br>今天继续长本事。</h1><p class="sub">小小的进步，也算升级 ✦</p></div><div class="smiley">☺</div></section>

  <section class="hero">
    <div class="hero-copy"><span class="kicker">NEXT CHAPTER</span><h2>DATA<br>AGENT LAB</h2><p>别急着追新名词。<br>今天把一件事真正搞明白。</p><button class="cta tap" data-label="下一步会接到正在学习的章节">接着学 <span>→</span></button></div>
    <div class="hero-art"><svg viewBox="0 0 280 210"><path d="M23 173c36-18 73-20 111-4 42 17 76 12 123-3" fill="none" stroke="#141418" stroke-width="4" stroke-linecap="round"/><path d="M196 145c6-19 22-31 44-36 6 16 5 31-3 46" fill="#a9df83" stroke="#141418" stroke-width="4"/><path d="M220 114 239 83l18 31Z" fill="#a9df83" stroke="#141418" stroke-width="4"/><path d="M94 119c-8-31 5-61 31-75 30-16 70 0 78 32 5 20-2 39-15 54" fill="#fff" stroke="#141418" stroke-width="4"/><path d="M145 39c15 1 28 11 31 27 2 12-2 22-12 30-18-5-28-16-31-32-1-9 3-18 12-25Z" fill="#141418"/><path d="M140 64c7-11 22-13 32-5 9 7 10 21 2 30-9 9-23 10-33 2-10-8-10-18-1-27Z" fill="#f0b28b" stroke="#141418" stroke-width="3"/><circle cx="150" cy="75" r="2.6"/><circle cx="166" cy="75" r="2.6"/><path d="M151 84c6 4 11 4 16 0" fill="none" stroke="#141418" stroke-width="2.4" stroke-linecap="round"/><path d="M121 126c-3-22 8-37 28-42 18-4 36 4 45 22 6 11 7 27 2 39" fill="#fff" stroke="#141418" stroke-width="4"/><path d="M109 105c-17 4-28 15-31 34M78 139c-2 15 6 25 24 30M186 106c17-4 29-1 39 9M201 116c-9 6-17 17-23 32M129 146 111 183m66-38 24 34" fill="none" stroke="#141418" stroke-width="9" stroke-linecap="round"/><path d="m102 185 22 2m74-5 21 4" stroke="#141418" stroke-width="9" stroke-linecap="round"/><rect x="182" y="83" width="48" height="23" rx="7" fill="#fff" stroke="#141418" stroke-width="4" transform="rotate(-8 182 83)"/><circle cx="224" cy="88" r="9" fill="#8fb2ff" stroke="#141418" stroke-width="3"/><circle cx="47" cy="52" r="7" fill="#ff962f"/><path d="M31 52h-9m48 0h9M47 36v-9m0 48v9" stroke="#141418" stroke-width="3" stroke-linecap="round"/></svg></div>
    <span class="scribble">Learn<br>Build<br>Grow</span><span class="spark sa">✦</span><span class="spark sb">✦</span>
  </section>

  <section class="grid">
    <button class="card tech tap" data-label="技术学习页：下一步就做它"><div class="topline"><span>01</span><span class="pill">12 个模块</span></div><h3>技术学习</h3><p>把底层逻辑摸清，别只会背名词。</p><span class="go">→</span></button>
    <button class="card project tap" data-label="项目学习页会接 Data Agent Lab"><div class="topline"><span>02</span><span class="pill">4 个项目</span></div><h3>项目实战</h3><p>把知识变成能拿出来讲的作品。</p><span class="go">→</span></button>
  </section>

  <button class="strip tap" data-label="AI 面试：后续接语音回答和评分"><span class="meta">03 / INTERVIEW LAB</span><h3>面试别背稿，练到能聊。</h3><p>技术追问 · 项目表达 · 简历优化</p><div class="strip-art"><svg viewBox="0 0 120 90"><path d="M49 23c12-11 34-9 44 5 8 12 8 29-2 40-10 12-29 15-42 7-16-10-18-37 0-52Z" fill="#fff" stroke="#141418" stroke-width="3"/><path d="M56 19c11-7 25-4 31 6 4 7 4 14 1 21-13 0-24-7-32-20Z" fill="#141418"/><rect x="51" y="51" width="49" height="28" rx="5" fill="#141418"/><rect x="57" y="56" width="37" height="17" rx="3" fill="#9dbbff"/><path d="M39 54c-9 1-15 7-17 17M95 47c9-7 15-9 23-6" fill="none" stroke="#141418" stroke-width="5" stroke-linecap="round"/></svg></div><span class="go">→</span></button>

  <section class="today"><div class="head"><div><span>今天别刷太多</span><h3>只拿下一个关键点。</h3></div><button class="tap" data-label="以后这里会根据薄弱点自动推荐">换一个 ↻</button></div><button class="pick tap" data-label="Write Ordering 知识详情页"><div class="pick-meta"><span>ICEBERG</span><span>18 MIN</span></div><div class="pick-main"><div><h3>Write Ordering</h3><p>不是“排个序”，是让数据在文件里更有组织。</p></div><span class="go">→</span></div><div class="progress"><i></i></div></button></section>

  <section class="growth"><div class="stat streak"><label>连续学习</label><strong>7 <small>天</small></strong><p>不用卷，别断就行。</p></div><div class="stat weekly"><label>本周进度</label><strong>68<small>%</small></strong><div class="progress green"><i></i></div></div></section>
  <div class="quote">“持续学习的人，总会和更好的机会相遇。”</div>
</div>
<nav class="nav"><button class="active"><svg viewBox="0 0 24 24"><path d="m4 11 8-7 8 7v9h-5v-6H9v6H4v-9Z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>首页</span></button><button class="tap" data-label="技术学习页"><svg viewBox="0 0 24 24"><path d="M4 5.5c3-1 5.5-.3 8 1.7 2.5-2 5-2.7 8-1.7v13c-3-.8-5.7-.2-8 1.8-2.3-2-5-2.6-8-1.8v-13Z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>学习</span></button><button class="tap" data-label="项目学习页"><svg viewBox="0 0 24 24"><path d="M8 7V5.5C8 4.7 8.7 4 9.5 4h5c.8 0 1.5.7 1.5 1.5V7M4 8h16v11H4V8Zm0 4.5h16" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>项目</span></button><button class="tap" data-label="AI 模拟面试"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>面试</span></button><button class="tap" data-label="个人学习数据"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 20c.8-4.3 3-6.2 6.5-6.2s5.7 1.9 6.5 6.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>我的</span></button></nav>
<div id="toast" class="toast"></div>
<script>
const toast=document.getElementById('toast');let t;
document.querySelectorAll('.tap').forEach(el=>el.addEventListener('click',()=>{clearTimeout(t);toast.textContent=el.dataset.label||'已点击';toast.classList.add('show');t=setTimeout(()=>toast.classList.remove('show'),1600)}));
</script>
</body></html>
