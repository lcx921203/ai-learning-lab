<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>

<meta name="apple-mobile-web-app-capable" content="yes"/>

<title>AI Learning Lab · Home V2</title>
<style>
:root{--ink:#111216;--muted:#838795;--paper:#f7f8fb;--line:#dfe2e9;--blue:#98b7ff;--purple:#dda5f4;--orange:#ffc07b;--mint:#bfe7c9;--pink:#ffd0de;}
*{box-sizing:border-box}html,body{margin:0;background:#eceff3;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",system-ui,sans-serif}button{font:inherit;color:inherit;border:0;background:none}.app{width:min(100%,430px);margin:auto;min-height:100dvh;background:var(--paper);padding:calc(16px + env(safe-area-inset-top)) 18px calc(104px + env(safe-area-inset-bottom));overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px}.brand strong{font-size:17px;letter-spacing:-.02em}.brand small{display:block;font-size:9.5px;color:#8d91a0;margin-top:3px;letter-spacing:.035em}.actions{display:flex;align-items:center;gap:8px}.iconbtn,.avatar{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;border:1px solid rgba(17,18,22,.07);box-shadow:0 7px 18px rgba(17,18,22,.06)}.avatar{background:#ffd5a9;font-weight:900;font-size:13px}
.intro{margin:0 2px 14px}.eyebrow{font-size:10px;letter-spacing:.12em;font-weight:900;color:#f18d33;margin:0 0 8px}.intro h1{font-size:31px;line-height:1.08;letter-spacing:-.045em;margin:0;font-weight:900}.intro p{margin:7px 0 0;color:#747887;font-size:13px}
.explore{position:relative;border-radius:26px;overflow:hidden;background:#eaf3ff;min-height:195px;border:1px solid rgba(17,18,22,.06);box-shadow:0 10px 26px rgba(30,55,90,.08)}.explore img{display:block;width:100%;height:195px;object-fit:cover;object-position:center 54%;filter:saturate(.96)}.explore .badge{position:absolute;left:15px;top:14px;padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);font-family:"Marker Felt","Comic Sans MS",cursive;font-size:13px;transform:rotate(-2deg);box-shadow:0 4px 12px rgba(20,20,24,.08)}.explore .note{position:absolute;right:14px;top:16px;font-family:"Marker Felt","Comic Sans MS",cursive;font-size:12px;line-height:1.05;transform:rotate(5deg)}
.sectionhead{display:flex;align-items:end;justify-content:space-between;margin:22px 2px 10px}.sectionhead h2{font-size:20px;margin:0;letter-spacing:-.025em}.sectionhead p{font-size:11px;color:#8a8d99;margin:3px 0 0}.sectionhead button{font-size:11px;color:#6268d9}
.pathgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.path{min-height:148px;border-radius:22px;padding:15px;position:relative;text-align:left;border:1.3px solid rgba(17,18,22,.11);overflow:hidden;box-shadow:0 7px 18px rgba(17,18,22,.04);transition:.16s transform}.path:active{transform:scale(.975)}.python{background:linear-gradient(145deg,#c9f2d5,#b5e8c4)}.spark{background:linear-gradient(145deg,#c7dbff,#a7c7ff)}.iceberg{background:linear-gradient(145deg,#e7c7f7,#d8a8ef)}.dbt{background:linear-gradient(145deg,#ffd9a6,#ffc276)}.path .num{font-size:11px;font-weight:950;letter-spacing:.04em}.path .tag{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.72);border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800}.path h3{font-size:19px;line-height:1.1;margin:25px 0 7px;letter-spacing:-.03em}.path p{font-size:11px;line-height:1.45;margin:0;color:#34363f;max-width:88%}.mini{position:absolute;left:15px;right:15px;bottom:13px;display:flex;align-items:center;gap:8px}.bar{height:5px;background:rgba(17,18,22,.14);border-radius:999px;flex:1;overflow:hidden}.bar i{display:block;height:100%;border-radius:inherit;background:#5d7fea}.python .bar i{width:100%}.spark .bar i{width:57%}.iceberg .bar i{width:38%}.dbt .bar i{width:0%}.mini span{font-size:10px;font-weight:800;white-space:nowrap}.state{position:absolute;right:12px;bottom:12px;width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#111216;color:#fff;font-size:15px}
.projectstrip{margin-top:13px;background:#fff;border:1.3px solid var(--ink);border-radius:22px;padding:15px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 6px 16px rgba(17,18,22,.04)}.projectstrip .left small{font-size:9.5px;letter-spacing:.11em;font-weight:900;color:#7e8290}.projectstrip h3{font-size:18px;margin:5px 0 3px}.projectstrip p{font-size:11px;color:#858996;margin:0}.roundgo{width:38px;height:38px;border-radius:50%;background:#111216;color:#fff;display:grid;place-items:center;flex:0 0 auto;font-size:18px}
.today{margin-top:20px;background:#111216;color:#fff;border-radius:22px;padding:15px 16px;box-shadow:0 12px 24px rgba(17,18,22,.14)}.today .meta{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.12em;font-weight:900;color:#ffb16b}.today .main{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}.today h3{font-size:20px;margin:0 0 4px}.today p{font-size:11px;color:#c9ccd4;margin:0;line-height:1.4}.today .roundgo{background:#fff;color:#111216}
.nav{position:fixed;left:50%;bottom:max(9px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 22px),408px);height:66px;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border:1px solid rgba(17,18,22,.08);border-radius:24px;box-shadow:0 12px 28px rgba(17,18,22,.11);display:grid;grid-template-columns:repeat(5,1fr);padding:6px;z-index:20}.nav button{border-radius:18px;color:#9094a1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px}.nav button.active{background:#111216;color:#fff}.nav svg{width:20px;height:20px}
.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,14px);opacity:0;background:#111216;color:#fff;padding:9px 13px;border-radius:999px;font-size:11px;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:360px){.app{padding-left:14px;padding-right:14px}.intro h1{font-size:28px}.explore,.explore img{height:180px}.path{min-height:143px;padding:13px}.path h3{font-size:18px}}
</style>
