<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#F5F6F8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>LearnMate · AI 学习成长助手</title>
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="hello">
        <div class="avatar-wrap">
          <img src="https://cdn.prod.website-files.com/5e51c674258ffe10d286d30a/5e535216550b76cb4af21e3d_peep-16.svg" alt="学习者头像">
        </div>
        <div>
          <div class="hello-kicker">YOUR LEARNING DAY</div>
          <h1>下午好，挑一块。</h1>
        </div>
      </div>
      <button class="icon-btn tap" data-tip="学习日历">
        <img src="./assets/icons/calendar.svg" alt="">
      </button>
    </header>

    <button class="search tap" data-tip="搜索课程、项目、面试题">
      <img src="./assets/icons/search.svg" alt="">
      <span>今天想搞懂什么？</span>
      <span class="search-shortcut">⌘ K</span>
    </button>

    <section class="hero">
      <div class="hero-copy">
        <div class="hero-eyebrow">LEARN WITH AI</div>
        <h2>今天想拆<br>哪一块？</h2>
        <p>挑一块，今天搞懂它。</p>
        <button class="primary tap" data-tip="进入个性学习路线">开始学习 <span>→</span></button>
      </div>

      <div class="hero-art">
        <img class="peep" src="https://cdn.prod.website-files.com/5e51c674258ffe10d286d30a/5e53570264109d16a7014c37_peep-46.svg" alt="Open Peeps 手绘学习者">
      </div>

      <img class="doodle d1" src="./assets/doodles/star.svg" alt="">
      <img class="doodle d2" src="./assets/doodles/eye.svg" alt="">
      <img class="doodle d3" src="./assets/doodles/swoop.svg" alt="">
      <div class="hero-note">GOOD IDEAS<br>BETTER YOU</div>
    </section>

    <nav class="quick">
      <button class="quick-item active">
        <span class="quick-icon"><img src="./assets/icons/grid.svg" alt=""></span>
        <span>全部</span>
      </button>
      <button class="quick-item tap" data-tip="技术学习">
        <span class="quick-icon"><img src="./assets/icons/code.svg" alt=""></span>
        <span>技术</span>
      </button>
      <button class="quick-item tap" data-tip="项目实战">
        <span class="quick-icon"><img src="./assets/icons/folder.svg" alt=""></span>
        <span>项目</span>
      </button>
      <button class="quick-item tap" data-tip="面试训练">
        <span class="quick-icon"><img src="./assets/icons/mic.svg" alt=""></span>
        <span>面试</span>
      </button>
      <button class="quick-item tap" data-tip="职业成长">
        <span class="quick-icon"><img src="./assets/icons/chart.svg" alt=""></span>
        <span>成长</span>
      </button>
    </nav>

    <section class="section-head">
      <h3>今天先拿下一块</h3>
      <button class="text-btn tap" data-tip="换一组推荐">换一组 ↻</button>
    </section>

    <section class="bento">
      <button class="bento-card code-card tap" data-tip="进入代码学习">
        <span class="poster-num">01</span>
        <h4>代码先写顺。</h4>
        <img class="card-art laptop" src="./assets/icons/laptop.svg" alt="">
        <span class="poster-mark mark-code">&lt;/&gt;</span>
      </button>

      <button class="bento-card data-card tap" data-tip="进入数据引擎路线">
        <span class="poster-num">02</span>
        <h4>去引擎里<br>跑一圈。</h4>
        <img class="card-art cube" src="./assets/icons/cube.svg" alt="">
        <span class="orbit orbit-a"></span>
        <span class="orbit orbit-b"></span>
      </button>

      <button class="bento-card interview-card tap" data-tip="开始 AI 模拟面试">
        <span class="poster-num">03</span>
        <h4>别背稿。<br>练到能聊。</h4>
        <img class="card-art mic-art" src="./assets/icons/mic-big.svg" alt="">
        <span class="wave w1"></span><span class="wave w2"></span><span class="wave w3"></span>
      </button>

      <button class="bento-card plan-card tap" data-tip="打开学习规划">
        <span class="poster-num">04</span>
        <h4>下一步，别瞎猜。</h4>
        <img class="card-art chart-art" src="./assets/icons/chart-big.svg" alt="">
        <span class="slash s1"></span><span class="slash s2"></span>
      </button>
    </section>

    <section class="ai-strip tap" data-tip="打开 AI 学习助手">
      <div class="orb" aria-hidden="true"><i></i><i></i></div>
      <div class="ai-copy">
        <span>AI COMPANION</span>
        <h4>嗨，我一直在。</h4>
      </div>
      <button class="round-dark">→</button>
    </section>

    <blockquote>
      小步走，也是在升级。
    </blockquote>
  </main>

  <nav class="bottom-nav">
    <button class="active">
      <img src="./assets/icons/home.svg" alt=""><span>首页</span>
    </button>
    <button class="tap" data-tip="学习"><img src="./assets/icons/book.svg" alt=""><span>学习</span></button>
    <button class="tap" data-tip="AI 助手"><img src="./assets/icons/ai.svg" alt=""><span>AI 助手</span></button>
    <button class="tap" data-tip="项目"><img src="./assets/icons/folder.svg" alt=""><span>项目</span></button>
    <button class="tap" data-tip="我的"><img src="./assets/icons/user.svg" alt=""><span>我的</span></button>
  </nav>

  <div id="toast" class="toast"></div>
  <script src="./js/app.js"></script>
</body>
</html>
